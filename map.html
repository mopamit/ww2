<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חדר מלחמה: 1939-1945</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- פונט מכונת כתיבה לאווירת רטרו -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #111;
            --terminal-green: #33ff33;
            --terminal-amber: #ffb000;
            --axis-red: #ff3333;
            --allies-blue: #3399ff;
            --soviet-purple: #bd00ff;
            --panel-bg: rgba(10, 10, 10, 0.9);
            --border-color: #444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier Prime', monospace; /* פונט מכונת כתיבה */
            background-color: var(--bg-color);
            color: #eee;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- אפקט מסך ישן (Scanlines) --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none; /* מאפשר לחיצות דרך האפקט */
            z-index: 9999;
            opacity: 0.6;
        }

        /* --- סרגל עליון --- */
        #top-bar {
            background: #000;
            border-bottom: 2px solid var(--border-color);
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
        }

        .status-box {
            border: 1px solid var(--border-color);
            padding: 5px 15px;
            background: #222;
        }

        #year-display { color: var(--terminal-amber); font-weight: bold; font-size: 1.5rem; letter-spacing: 2px; }
        #score-display { color: var(--terminal-green); }

        /* --- מפה --- */
        #map {
            flex-grow: 1;
            background: #1a1a1a;
            z-index: 1;
        }

        /* עיצוב התוויות על המפה */
        .leaflet-tooltip.country-label {
            background: transparent;
            border: none;
            box-shadow: none;
            color: rgba(255,255,255,0.9);
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            text-shadow: 2px 2px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        
        .flag-icon { font-size: 24px; display: block; margin-bottom: -5px; }

        /* --- יומן אירועים (צד ימין) --- */
        #event-log-container {
            position: absolute;
            top: 70px;
            right: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        #log-toggle {
            background: #333;
            color: #fff;
            border: 1px solid var(--border-color);
            border-right: none;
            padding: 10px;
            cursor: pointer;
            font-family: inherit;
        }

        #event-log {
            width: 300px;
            max-height: 50vh;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid var(--border-color);
            border-right: none;
            overflow-y: auto;
            padding: 10px;
            display: none; /* מוסתר כברירת מחדל */
            font-size: 0.9rem;
        }

        .log-entry {
            border-bottom: 1px dashed #444;
            padding: 8px 0;
            color: #aaa;
        }
        .log-entry span { color: var(--terminal-amber); display: block; font-weight: bold; font-size: 0.8rem; }
        .log-entry.active { color: #fff; border-left: 3px solid var(--terminal-green); padding-left: 5px; }

        /* --- פאנל תחתון (משימות) --- */
        #briefing-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            padding: 20px;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        #briefing-title {
            color: var(--terminal-amber);
            margin: 0 0 10px 0;
            text-transform: uppercase;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        #instruction {
            color: var(--terminal-green);
            font-size: 0.8rem;
            margin-top: 10px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

        /* --- מסכים קופצים --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .modal-content {
            border: 2px solid var(--terminal-green);
            padding: 40px;
            max-width: 600px;
            text-align: center;
            background: #000;
            box-shadow: 0 0 20px var(--terminal-green);
        }

        .btn {
            background: transparent;
            border: 1px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 10px 30px;
            font-family: inherit;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn:hover { background: var(--terminal-green); color: #000; }
        .hidden { display: none !important; }

    </style>
</head>
<body>

    <div class="scanlines"></div>

    <!-- אודיו לרקע -->
    <!-- שים לב: הקובץ war.mp3 צריך להיות באותה תיקייה. הוספתי loop כדי שיתנגן ברצף -->
    <audio id="bg-music" loop>
        <source src="war.mp3" type="audio/mpeg">
    </audio>

    <div id="top-bar">
        <div class="status-box">תאריך: <span id="year-display">1939</span></div>
        <div style="font-size: 1.2rem; color: #666; letter-spacing: 5px;">TOP SECRET</div>
        <div class="status-box">ניקוד: <span id="score-display">0</span></div>
    </div>

    <!-- יומן אירועים נפתח -->
    <div id="event-log-container">
        <button id="log-toggle" onclick="toggleLog()">יומן מבצעים ▼</button>
        <div id="event-log">
            <!-- לוגים יתווספו כאן דינמית -->
        </div>
    </div>

    <div id="map"></div>

    <div id="briefing-panel" class="hidden">
        <h3 id="briefing-title"></h3>
        <div id="briefing-text"></div>
        <div id="instruction">>> המתן לפקודות או לחץ על היעד...</div>
    </div>

    <!-- מסך פתיחה -->
    <div id="start-screen" class="modal">
        <div class="modal-content">
            <h1 style="color: var(--terminal-green); text-shadow: 0 0 10px;">WAR ROOM</h1>
            <p>סימולציית מלחמת העולם השנייה</p>
            <p style="font-size: 0.9rem; color: #888;">הפעלת רמקולים מומלצת</p>
            <button class="btn" onclick="startGame()">התחל משימה</button>
        </div>
    </div>

    <!-- מסך סיום שלב -->
    <div id="level-modal" class="modal hidden">
        <div class="modal-content" style="border-color: var(--terminal-amber); box-shadow: 0 0 20px var(--terminal-amber);">
            <h2 id="level-title" style="color: var(--terminal-amber)">דיווח מודיעין</h2>
            <p id="level-desc"></p>
            <button class="btn" style="border-color: var(--terminal-amber); color: var(--terminal-amber)" onclick="nextLevel()">המשך</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- נתוני המדינות (עברית בלבד) ---
        const countryData = {
            "Germany": { name: "גרמניה", flag: "🇩🇪", side: "axis" },
            "Italy": { name: "איטליה", flag: "🇮🇹", side: "axis" },
            "Poland": { name: "פולין", flag: "🇵🇱", side: "neutral" },
            "France": { name: "צרפת", flag: "🇫🇷", side: "allies" },
            "United Kingdom": { name: "בריטניה", flag: "🇬🇧", side: "allies" },
            "Russia": { name: "ברית המועצות", flag: "☭", side: "soviet" },
            "United States": { name: "ארה\"ב", flag: "🇺🇸", side: "allies" },
            "Norway": { name: "נורבגיה", flag: "🇳🇴", side: "neutral" },
            "Denmark": { name: "דנמרק", flag: "🇩🇰", side: "neutral" },
            "Belgium": { name: "בלגיה", flag: "🇧🇪", side: "allies" },
            "Netherlands": { name: "הולנד", flag: "🇳🇱", side: "allies" },
            "Greece": { name: "יוון", flag: "🇬🇷", side: "allies" },
            "Spain": { name: "ספרד", flag: "🇪🇸", side: "neutral" },
            "Sweden": { name: "שבדיה", flag: "🇸🇪", side: "neutral" },
            "Switzerland": { name: "שוויץ", flag: "🇨🇭", side: "neutral" },
            "Portugal": { name: "פורטוגל", flag: "🇵🇹", side: "neutral" },
            "Romania": { name: "רומניה", flag: "🇷🇴", side: "axis" },
            "Hungary": { name: "הונגריה", flag: "🇭🇺", side: "axis" },
            "Finland": { name: "פינלנד", flag: "🇫🇮", side: "neutral" }
        };

        // --- שלבי המשחק ---
        const campaigns = [
            {
                year: "1939",
                title: "הסכם ריבנטרופ-מולוטוב",
                text: "אוגוסט 1939. גרמניה וברית המועצות מחלקות ביניהן את מזרח אירופה. לחץ על המדינה שתחולק בין המעצמות.",
                targetId: "Poland",
                zoom: [52, 20],
                actionType: "split",
                fact: "פולין נמחקה מהמפה. גרמניה קיבלה את המערב, ברית המועצות את המזרח."
            },
            {
                year: "1.9.1939",
                title: "פרוץ המלחמה",
                text: "גרמניה פותחת ב'בליצקריג' (מלחמת בזק). לחץ על גרמניה כדי לשלח את הכוחות.",
                targetId: "Germany",
                zoom: [51, 10],
                actionType: "axis_attack",
                fact: "וורשה הופצצה. בריטניה וצרפת הכריזו מלחמה, אך לא עשו דבר."
            },
            {
                year: "1940",
                title: "הנפילה במערב",
                text: "גרמניה עוקפת את קו ההגנה ופולשת לצרפת. הצבא הצרפתי קורס תוך שבועות.",
                targetId: "France",
                zoom: [46, 2],
                actionType: "conquest",
                fact: "פריז נכבשה. ממשל בובות הוקם בוישי. אירופה כמעט כולה תחת מגף הנאצים."
            },
            {
                year: "1940",
                title: "הקרב על בריטניה",
                text: "היעד הבא של היטלר: לונדון. הקרב מתנהל באוויר בלבד. לחץ על המדינה שעמדה לבדה.",
                targetId: "United Kingdom",
                zoom: [54, -2],
                actionType: "defend",
                fact: "הראדאר והטייסים הבריטים שברו את הלופטוואפה. הפלישה בוטלה."
            },
            {
                year: "1941",
                title: "מבצע ברברוסה",
                text: "יוני 1941. גרמניה בוגדת בבעלת בריתה ותוקפת את המעצמה במזרח.",
                targetId: "Russia",
                zoom: [55, 37],
                actionType: "soviet_defend",
                fact: "הגרמנים הגיעו לשערי מוסקבה, אך קפאו בחורף הרוסי. המלחמה הפכה עולמית."
            },
            {
                year: "1943",
                title: "החזית האיטלקית",
                text: "בעלות הברית פולשות ל'בטן הרכה' של אירופה מדרום.",
                targetId: "Italy",
                zoom: [42, 12],
                actionType: "liberate",
                fact: "איטליה נכנעה. גרמניה פלשה לצפון איטליה כדי לעצור את בעלות הברית."
            },
            {
                year: "1944",
                title: "הפלישה לנורמנדי",
                text: "6 ביוני 1944. הצי הגדול בהיסטוריה נוחת בחופי צרפת כדי לשחרר את אירופה.",
                targetId: "France",
                zoom: [48, 2],
                actionType: "liberate",
                fact: "החומה האטלנטית נפרצה. הדרך לברלין נפתחה."
            },
            {
                year: "1945",
                title: "סוף הרייך",
                text: "מאי 1945. הרוסים בברלין. האמריקאים במערב. לחץ על גרמניה לכניעה סופית.",
                targetId: "Germany",
                zoom: [51, 10],
                actionType: "final_victory",
                fact: "גרמניה נכנעה ללא תנאי. המלחמה באירופה הסתיימה."
            }
        ];

        let map, geoJsonLayer;
        let currentStageIdx = 0;
        let score = 0;
        let isInputLocked = true;

        // --- אתחול המפה ---
        function initMap() {
            // הגדרת מפה עם שליטה (זום וגרירה מאופשרים)
            map = L.map('map', {
                center: [50, 15],
                zoom: 4,
                zoomControl: true, // הוספת כפתורי זום
                dragging: true, // אפשרות גרירה
                attributionControl: false,
                minZoom: 3
            });

            // עיצוב כהה ומותאם אישית למפה
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(map);

            // טעינת נתונים
            fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
            .then(res => res.json())
            .then(data => {
                const relevantFeatures = data.features.filter(f => {
                    if (f.properties.name === "United States of America") f.properties.name = "United States";
                    return Object.keys(countryData).includes(f.properties.name);
                });

                geoJsonLayer = L.geoJSON(relevantFeatures, {
                    style: getStyleBySide,
                    onEachFeature: onFeatureInteract
                }).addTo(map);
            });
        }

        function getStyleBySide(feature) {
            const name = feature.properties.name;
            const data = countryData[name];
            let color = '#333'; // ניטרלי כהה

            if (data) {
                if (data.side === 'axis') color = 'var(--axis-red)';
                else if (data.side === 'allies') color = 'var(--allies-blue)';
                else if (data.side === 'soviet') color = 'var(--soviet-purple)';
                else color = '#555';
            }

            return {
                fillColor: color,
                weight: 1,
                opacity: 1,
                color: '#222',
                fillOpacity: 0.5
            };
        }

        function onFeatureInteract(feature, layer) {
            const name = feature.properties.name;
            const info = countryData[name];

            if (info) {
                // תווית קבועה בעברית בלבד
                const labelContent = `<div class="flag-icon">${info.flag}</div>${info.name}`;
                layer.bindTooltip(labelContent, { 
                    permanent: true, 
                    direction: "center", 
                    className: "country-label" 
                });
            }

            layer.on('mouseover', function(e) {
                if(isInputLocked) return;
                layer.setStyle({ weight: 2, color: '#fff', fillOpacity: 0.8 });
            });

            layer.on('mouseout', function(e) {
                if(isInputLocked) return;
                if (!feature.properties.permanentColor) {
                    geoJsonLayer.resetStyle(layer);
                } else {
                    layer.setStyle({ 
                        fillColor: feature.properties.permanentColor,
                        fillOpacity: 0.6,
                        weight: 1,
                        color: '#222'
                    });
                }
            });

            layer.on('click', function(e) {
                if(isInputLocked) return;
                checkAnswer(feature.properties.name, layer);
            });
        }

        // --- לוגיקת משחק ---

        function startGame() {
            // ניגון מוזיקה (דורש אינטראקציית משתמש)
            const audio = document.getElementById('bg-music');
            if(audio) {
                audio.volume = 0.3; // ווליום התחלתי
                audio.play().catch(e => console.log("Audio play blocked until interaction"));
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('briefing-panel').classList.remove('hidden');
            document.getElementById('event-log').style.display = 'block'; // פתיחת הלוג בהתחלה
            
            initMap();
            setTimeout(() => loadLevel(0), 1000);
        }

        function loadLevel(idx) {
            if (idx >= campaigns.length) {
                endGame();
                return;
            }
            
            currentStageIdx = idx;
            const stage = campaigns[idx];
            
            document.getElementById('year-display').innerText = stage.year;
            document.getElementById('briefing-title').innerText = stage.title;
            
            // כתיבת טקסט באפקט מכונה
            typeWriter(stage.text, document.getElementById('briefing-text'), () => {
                isInputLocked = false;
                document.getElementById('instruction').style.opacity = 1;
            });

            // טיסה ליעד (אבל המשתמש יכול לשנות זום אחר כך)
            map.flyTo(stage.zoom, 5, { duration: 2 });

            // הוספה ליומן
            addToLog(stage.year, stage.title);
        }

        function addToLog(year, text) {
            const logDiv = document.getElementById('event-log');
            const entry = document.createElement('div');
            entry.className = "log-entry";
            entry.innerHTML = `<span>[${year}]</span> ${text}`;
            logDiv.prepend(entry); // הוספה למעלה
        }

        function toggleLog() {
            const log = document.getElementById('event-log');
            if (log.style.display === 'none') {
                log.style.display = 'block';
            } else {
                log.style.display = 'none';
            }
        }

        function checkAnswer(clickedName, layer) {
            const stage = campaigns[currentStageIdx];
            
            if (clickedName === stage.targetId) {
                // הצלחה
                isInputLocked = true;
                score += 100; // ניקוד הגיוני
                document.getElementById('score-display').innerText = score;

                // עדכון צבע
                let newColor = null;
                if (stage.actionType === 'conquest' || stage.actionType === 'split') newColor = 'var(--axis-red)';
                else if (stage.actionType === 'liberate' || stage.actionType === 'final_victory') newColor = 'var(--allies-blue)';
                
                if (newColor) {
                    layer.setStyle({ fillColor: newColor, fillOpacity: 0.8 });
                    layer.feature.properties.permanentColor = newColor;
                }

                // הצגת הודעת סיום שלב
                document.getElementById('level-title').innerText = "המשימה הושלמה";
                document.getElementById('level-desc').innerHTML = stage.fact;
                document.getElementById('level-modal').classList.remove('hidden');

            } else {
                // כישלון
                score -= 20; // קנס סביר
                document.getElementById('score-display').innerText = score;
                layer.setStyle({ fillColor: '#666', fillOpacity: 0.9 });
                setTimeout(() => { 
                    if (!layer.feature.properties.permanentColor) geoJsonLayer.resetStyle(layer);
                }, 500);
            }
        }

        function nextLevel() {
            document.getElementById('level-modal').classList.add('hidden');
            loadLevel(currentStageIdx + 1);
        }

        function endGame() {
            const modal = document.getElementById('level-modal');
            document.getElementById('level-title').innerText = "המלחמה הסתיימה";
            document.getElementById('level-desc').innerHTML = `ניקוד סופי: ${score}<br>העולם החופשי ניצל.`;
            modal.classList.remove('hidden');
            modal.querySelector('button').innerText = "שחק שוב";
            modal.querySelector('button').onclick = () => location.reload();
        }

        function typeWriter(text, element, callback) {
            element.innerHTML = "";
            let i = 0;
            const speed = 20;
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else if (callback) callback();
            }
            type();
        }

    </script>
</body>
</html>
