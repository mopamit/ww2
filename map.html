<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מלחמת העולם השנייה - חדר מצב</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- גופנים -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Heebo:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #111;
            --terminal-green: #33ff33;
            --terminal-amber: #ffb000;
            --axis-red: #ff4444;
            --allies-blue: #4488ff;
            --panel-bg: rgba(10, 15, 20, 0.95);
            --border-color: #555;
            --card-bg: #fdfbf7;
            --card-text: #2c1e12;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier Prime', monospace;
            background-color: var(--bg-color);
            color: #eee;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- מסך סריקה (Scanlines) --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.3;
        }

        /* --- תפריט ראשי --- */
        #main-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000 url('https://www.transparenttextures.com/patterns/black-felt.png'); 
            z-index: 5000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .menu-title {
            font-size: 4rem;
            color: var(--terminal-amber);
            text-shadow: 0 0 20px var(--terminal-amber);
            margin-bottom: 50px;
            border-bottom: 2px solid var(--terminal-amber);
            padding-bottom: 20px;
        }

        .menu-btn {
            background: transparent;
            border: 2px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 20px 50px;
            margin: 15px;
            font-family: 'Courier Prime', monospace;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            width: 500px;
        }

        .menu-btn:hover {
            background: var(--terminal-green);
            color: #000;
            box-shadow: 0 0 30px var(--terminal-green);
        }

        /* --- ממשק משחק כללי --- */
        #game-ui {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        #top-bar {
            background: #000;
            border-bottom: 2px solid var(--border-color);
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
        }

        .home-btn {
            background: #333;
            color: white;
            border: 1px solid #666;
            padding: 5px 15px;
            cursor: pointer;
            font-family: inherit;
        }

        #mode-title { color: var(--terminal-amber); font-weight: bold; font-size: 1.2rem; }
        
        #map {
            flex-grow: 1;
            background: #aadaff; /* רקע כחול לגיבוי */
            z-index: 1;
        }

        /* תוויות מדינות משופרות */
        .leaflet-tooltip.country-label {
            background: rgba(0, 0, 0, 0.6); /* רקע כהה לקריאות על המפה הצבעונית */
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            color: #fff;
            font-family: 'Heebo', sans-serif;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
            white-space: nowrap;
        }
        
        .label-flag { font-size: 20px; display: block; margin-bottom: 2px; }
        .label-name { font-size: 12px; display: block; text-shadow: 1px 1px 2px black; }

        /* --- אלמנטים למשחק 1: ציר הזמן --- */
        #timeline-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            background: var(--panel-bg);
            border: 2px solid var(--terminal-green);
            padding: 20px;
            z-index: 1000;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: none;
        }

        /* --- אלמנטים למשחק 2: כרטיסיות --- */
        #cards-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            background: var(--card-bg);
            color: var(--card-text);
            padding: 0;
            z-index: 1000;
            box-shadow: 5px 5px 25px rgba(0,0,0,0.7);
            font-family: 'Heebo', sans-serif;
            border: 4px solid #333;
            display: none;
        }

        .card-header {
            background: #8b0000;
            color: white;
            padding: 15px;
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            border-bottom: 4px solid #000;
            text-transform: uppercase;
        }

        .card-content {
            padding: 25px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .card-content b { color: #8b0000; }
        .card-section { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #ccc; }
        .card-section:last-child { border-bottom: none; }

        #find-instruction {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: var(--terminal-amber);
            padding: 15px 40px;
            border-radius: 4px;
            font-size: 1.5rem;
            border: 2px solid var(--terminal-amber);
            box-shadow: 0 0 20px var(--terminal-amber);
            display: none;
            z-index: 1000;
            text-align: center;
        }

        /* --- יומן אירועים (משותף) --- */
        #event-log {
            position: absolute;
            top: 70px;
            left: 10px;
            width: 250px;
            max-height: 400px;
            overflow-y: auto;
            background: rgba(0,0,0,0.8);
            border: 1px solid #444;
            color: #ccc;
            padding: 10px;
            font-size: 0.8rem;
            display: none;
            z-index: 999;
        }

        /* --- אנימציות וכללי --- */
        .hidden { display: none !important; }
        .blink { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

    </style>
</head>
<body>

    <div class="scanlines"></div>
    <audio id="bg-music" loop>
        <source src="war.mp3" type="audio/mpeg">
    </audio>

    <!-- תפריט ראשי -->
    <div id="main-menu">
        <div class="menu-title">WWII COMMAND CENTER</div>
        <button class="menu-btn" onclick="startTimelineGame()">משחק 1: המלחמה על ציר הזמן</button>
        <button class="menu-btn" onclick="startCardsGame()">משחק 2: הכר את המפה (ארכיון)</button>
    </div>

    <!-- ממשק משחק -->
    <div id="game-ui">
        <div id="top-bar">
            <div>
                <button class="home-btn" onclick="location.reload()">חזרה לתפריט</button>
                <span id="mode-title" style="margin-right: 20px;"></span>
            </div>
            <div id="status-display" style="color:white; font-weight:bold;"></div>
        </div>

        <div id="map"></div>
        <div id="event-log"></div>

        <!-- פאנל משחק 1: ציר הזמן -->
        <div id="timeline-panel">
            <h3 id="briefing-title" style="color:var(--terminal-amber); margin:0 0 10px 0;"></h3>
            <div id="briefing-text" style="font-size:1.1rem; line-height:1.5;"></div>
            <div id="timeline-instruction" class="blink" style="color:var(--terminal-green); margin-top:10px;">>> לחץ על היעד במפה</div>
        </div>

        <!-- פאנל משחק 2: כרטיסיות -->
        <div id="find-instruction"></div>
        
        <div id="cards-panel">
            <div class="card-header" id="card-header">תיק מדינה</div>
            <div class="card-content" id="card-body">
                <!-- תוכן הכרטיס ייכנס כאן -->
            </div>
            <div style="text-align:center; padding:15px; background:#e0e0e0; border-top:1px solid #999;">
                <button onclick="nextCard()" style="padding:10px 30px; background:#8b0000; color:white; border:none; cursor:pointer; font-size:1.1rem; font-weight:bold;">סגור תיק והמשך >></button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ==========================================
        // 1. נתונים גיאוגרפיים וכלליים
        // ==========================================
        let map, geoJsonLayer;
        let currentGameMode = null; // 'timeline' or 'cards'
        let currentStageIndex = 0;
        let score = 0;
        let isInputLocked = false;

        // מיפוי שמות באנגלית לשמות בעברית ודגלים
        const countryData = {
            "Germany": { name: "גרמניה", flag: "🇩🇪", side: "axis" },
            "Italy": { name: "איטליה", flag: "🇮🇹", side: "axis" },
            "Poland": { name: "פולין", flag: "🇵🇱", side: "neutral" },
            "France": { name: "צרפת", flag: "🇫🇷", side: "allies" },
            "United Kingdom": { name: "בריטניה", flag: "🇬🇧", side: "allies" },
            "Russia": { name: "ברית המועצות", flag: "☭", side: "soviet" },

            "Norway": { name: "נורבגיה", flag: "🇳🇴", side: "neutral" },
            "Denmark": { name: "דנמרק", flag: "🇩🇰", side: "neutral" },
            "Belgium": { name: "בלגיה", flag: "🇧🇪", side: "allies" },
            "Netherlands": { name: "הולנד", flag: "🇳🇱", side: "allies" },

            "Spain": { name: "ספרד", flag: "🇪🇸", side: "neutral" },
            "Sweden": { name: "שבדיה", flag: "🇸🇪", side: "neutral" },

            "Romania": { name: "רומניה", flag: "🇷🇴", side: "axis" },
            "Hungary": { name: "הונגריה", flag: "🇭🇺", side: "axis" },
            "Finland": { name: "פינלנד", flag: "🇫🇮", side: "neutral" },
            "Austria": { name: "אוסטריה", flag: "🇦🇹", side: "axis" },
            "Czech Republic": { name: "צ'כוסלובקיה", flag: "🇨🇿", side: "allies" },
            "Bulgaria": { name: "בולגריה", flag: "🇧🇬", side: "axis" },
            "Republic of Serbia": { name: "יוגוסלביה", flag: "🇷🇸", side: "neutral" }, 
            "Croatia": { name: "קרואטיה", flag: "🇭🇷", side: "neutral" },
            "Japan": { name: "יפן", flag: "🇯🇵", side: "axis" }
        };

        // ==========================================
        // 2. נתוני משחק 1: ציר הזמן
        // ==========================================
        const timelineStages = [
            {
                year: "1938",
                title: "אנשלוס",
                text: "היטלר מספח את אוסטריה לגרמניה ללא ירייה אחת. האוסטרים מקבלים את הנאצים באהדה.<br><b>משימה:</b> לחץ על אוסטריה.",
                targetId: "Austria",
                zoom: [47, 13],
                action: "axis_annex",
                successMsg: "אוסטריה סופחה לרייך."
            },
            {
                year: "1939, אוגוסט",
                title: "הסכם ריבנטרופ-מולוטוב",
                text: "הסכם מפתיע בין גרמניה הנאצית לברית המועצות הקומוניסטית. הן מחלקות ביניהן את מזרח אירופה.<br><b>משימה:</b> לחץ על המדינה שתחולק - פולין.",
                targetId: "Poland",
                zoom: [52, 20],
                action: "split",

            },
            {

                title: "פרוץ המלחמה",
                text: "גרמניה פולשת לפולין ב'בליצקריג' (מלחמת בזק). בריטניה וצרפת מכריזות מלחמה.<br><b>משימה:</b> לחץ על גרמניה כדי להתחיל את המתקפה.",
                targetId: "Germany",
                zoom: [51, 10],
                action: "axis_attack",
                successMsg: "המלחמה החלה. וורשה נכבשה תוך שבועיים."
            },
            {
                year: "1940, אפריל",
                title: "כיבוש צפון אירופה",
                text: "גרמניה פונה צפונה וכובשת מדינות קטנות במהירות.<br><b>משימה:</b> לחץ על נורווגיה.",
                targetId: "Norway",
                zoom: [60, 8],
                action: "conquest",
                successMsg: "דנמרק ונורווגיה נכבשו."
            },
            {
                year: "1940, מאי",
                title: "הפלישה למערב",
                text: "גרמניה עוקפת את קו ההגנה ופולשת דרך בלגיה והולנד לתוך צרפת. הבריטים בורחים בדנקרק.<br><b>משימה:</b> לחץ על צרפת.",
                targetId: "France",
                zoom: [46, 2],
                action: "conquest",
                successMsg: "צרפת נכנעה ביוני 1940. הוקם 'ממשל וישי'."
            },
            {
                year: "1940-1941",
                title: "הקרב על בריטניה",
                text: "בריטניה נותרה לבדה. קרבות אוויר קשים בין הלופטוואפה לחיל האוויר המלכותי.<br><b>משימה:</b> לחץ על בריטניה.",
                targetId: "United Kingdom",
                zoom: [54, -2],
                action: "defend",
                successMsg: "בריטניה החזיקה מעמד ולא נכבשה."
            },
            {
                year: "1941, יוני",
                title: "מבצע ברברוסה",
                text: "היטלר מפר את ההסכם ותוקף את ברית המועצות.<br><b>משימה:</b> לחץ על ברית המועצות.",
                targetId: "Russia",
                zoom: [55, 37],
                action: "soviet_defend",
                successMsg: "הגרמנים נבלמו בחורף הרוסי."
            },
            {
                year: "1941, דצמבר",
                title: "פרל הארבור",
                text: "יפן תוקפת את ארה\"ב. ארה\"ב מצטרפת למלחמה.<br><b>משימה:</b> לחץ על יפן (במזרח הרחוק).",
                targetId: "Japan",
                zoom: [36, 138],
                action: "axis_attack",
                successMsg: "המלחמה הפכה לעולמית באמת."
            },
            {
                year: "1944, יוני",
                title: "הפלישה לנורמנדי",
                text: "יום ה-D-Day. בעלות הברית נוחתות בצרפת לשחרור אירופה.<br><b>משימה:</b> לחץ על צרפת.",
                targetId: "France",
                zoom: [48, 2],
                action: "liberate",
                successMsg: "צרפת שוחררה. הדרך לברלין פתוחה."
            },
            {
                year: "1945, מאי",
                title: "כניעת גרמניה",
                text: "הרוסים בברלין. היטלר מתאבד. גרמניה נכנעת.<br><b>משימה:</b> לחץ על גרמניה.",
                targetId: "Germany",
                zoom: [51, 10],
                action: "final_victory",
                successMsg: "המלחמה באירופה הסתיימה."
            }
        ];

        // ==========================================
        // 3. נתוני משחק 2: הכר את המפה (כרטיסים)
        // ==========================================
        const countryCards = [
            {
                id: "Austria",
                title: "אוסטריה",
                content: `
                    <div class='card-section'><b>תאריך:</b> 13 במרץ 1938</div>
                    <div class='card-section'><b>סטטוס מדיני:</b> סופחה לגרמניה (האנשלוס).</div>
                    <div class='card-section'>
                        <b>פירוט:</b><br>
                        אוסטריה הפכה לחלק מהרייך הגרמני. חיילי גרמניה נכנסו והתקבלו באהדה רבה על ידי מרבית האוסטרים.
                        <br><br>
                        כ-950,000 אוסטרים נלחמו למען גרמניה הנאצית. אוסטרים רבים השתלבו בהנהגה הנאצית ובפיקוד על מחנות המוות.
                    </div>`
            },
            {
                id: "Czech Republic",
                title: "צ'כוסלובקיה",
                content: `
                    <div class='card-section'><b>תאריך:</b> 1938 (חבל הסודטים), מרץ 1939 (כיבוש מלא).</div>
                    <div class='card-section'><b>סטטוס מדיני:</b> פורקה ונכבשה.</div>
                    <div class='card-section'>
                        <b>פירוט:</b><br>
                        לאחר ויתור המעצמות ב"הסכם מינכן", גרמניה סיפחה את חבל הסודטים. ב-1939 היא כבשה את יתר המדינה.

                    </div>`
            },
            {
                id: "Poland",
                title: "פולין",
                content: `

                    <div class='card-section'><b>סטטוס מדיני:</b> נכבשה וחולקה.</div>
                    <div class='card-section'>
                        <b>פירוט:</b><br>

                        <br><br>
                        בהתאם להסכם ריבנטרופ-מולוטוב, פולין חולקה לשלושה:
                        1. המערב סופח לגרמניה.
                        2. המזרח סופח לברית המועצות.
                        3. המרכז הפך ל"גנרלגוברנמן" (ממשל כללי) תחת שלטון אכזרי של האס-אס.
                    </div>`
            },
            {
                id: "Denmark",
                title: "דנמרק",
                content: `
                    <div class='card-section'><b>תאריך:</b> אפריל 1940.</div>
                    <div class='card-section'><b>סטטוס מדיני:</b> כיבוש "ייחודי".</div>
                    <div class='card-section'>
                        <b>פירוט:</b><br>
                        בניגוד למדינות אחרות, בדנמרק מוסדות השלטון, הממשלה והמלך המשיכו לתפקד תחת הכיבוש עד 1943.
                        <br><br>
                        הם ניהלו דו-שיח מורכב עם הנאצים בניסיון לשמור על הדמוקרטיה. החל מ-1943 הגרמנים הידקו את האחיזה והאס-אס השתלט על המדינה.
                    </div>`
            },
            {
                id: "Norway",
                title: "נורווגיה",
                content: `
                    <div class='card-section'><b>תאריך:</b> אפריל-יוני 1940.</div>
                    <div class='card-section'><b>סטטוס מדיני:</b> כיבוש וממשלת בובות.</div>
                    <div class='card-section'>
                        <b>פירוט:</b><br>

        // ==========================================
        // 4. אתחול מפה ופונקציות עזר
        // ==========================================
        function initMap() {
            if (map) return; 

            map = L.map('map', {
                center: [50, 15],
                zoom: 4,
                zoomControl: true,
                minZoom: 3,
                maxBounds: [[-85, -180], [85, 180]]
            });

            // שימוש במפה צבעונית עם אוקיינוסים כחולים (ללא תוויות)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap & CartoDB',
                maxZoom: 19
            }).addTo(map);

            fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
            .then(res => res.json())
            .then(data => {
                const relevant = data.features.filter(f => {
                    let name = f.properties.name;
                    if (name === "United States of America") f.properties.name = "United States";
                    return Object.keys(countryData).includes(f.properties.name);
                });

                geoJsonLayer = L.geoJSON(relevant, {
                    style: getStyle,
                    onEachFeature: onFeatureInteract
                }).addTo(map);
            });
        }

        function getStyle(feature) {
            const name = feature.properties.name;
            const data = countryData[name];
            let color = '#555';

            if (data) {
                if (data.side === 'axis') color = 'var(--axis-red)';
                else if (data.side === 'allies') color = 'var(--allies-blue)';
                else if (data.side === 'soviet') color = '#9b59b6';
                else color = '#7f8c8d';
            }

            return {
                fillColor: color,
                weight: 1,
                opacity: 1,
                color: '#444', // גבול כהה יותר למפה הבהירה
                fillOpacity: 0.6
            };
        }

        function onFeatureInteract(feature, layer) {
            // הטיפול בתוויות נעשה בפונקציית updateLabels לפי מצב המשחק
            
            layer.on('mouseover', function(e) {
                if (isInputLocked) return;
                layer.setStyle({ weight: 3, color: '#000', fillOpacity: 0.8 });
            });

            layer.on('mouseout', function(e) {
                if (isInputLocked) return;
                if (!layer.feature.properties.permanentColor) {
                    geoJsonLayer.resetStyle(layer);
                } else {
                    layer.setStyle({ 
                        fillColor: layer.feature.properties.permanentColor,
                        fillOpacity: 0.7,
                        weight: 1,
                        color: '#444'
                    });
                }
            });

            layer.on('click', function(e) {
                if (isInputLocked) return;
                handleMapClick(feature.properties.name, layer);
            });
        }

        // פונקציה לעדכון התוויות לפי סוג המשחק
        function updateMapLabels(showNames) {
            if (!geoJsonLayer) return;

            geoJsonLayer.eachLayer(layer => {
                const name = layer.feature.properties.name;
                const info = countryData[name];
                
                if (info) {
                    layer.unbindTooltip(); // הסרת תווית קודמת
                    
                    let content = `<span class="label-flag">${info.flag}</span>`;
                    if (showNames) {
                        content += `<span class="label-name">${info.name}</span>`;
                    }

                    layer.bindTooltip(content, { 
                        permanent: true, 
                        direction: "center", 
                        className: "country-label" 
                    });
                }
            });
        }

        // ==========================================
        // 5. לוגיקת משחק כללית
        // ==========================================
        
        function resetGame() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('timeline-panel').style.display = 'none';
            document.getElementById('cards-panel').style.display = 'none';
            document.getElementById('find-instruction').style.display = 'none';
            document.getElementById('event-log').style.display = 'none';
            
            const audio = document.getElementById('bg-music');
            if(audio) { audio.volume = 0.3; audio.play().catch(e=>{}); }

            initMap();
            
            if(geoJsonLayer) {
                geoJsonLayer.eachLayer(layer => {
                    delete layer.feature.properties.permanentColor;
                    geoJsonLayer.resetStyle(layer);
                });
            }
        }

        function handleMapClick(clickedName, layer) {
            if (currentGameMode === 'timeline') {
                checkTimelineAnswer(clickedName, layer);
            } else if (currentGameMode === 'cards') {
                checkCardAnswer(clickedName, layer);
            }
        }

        // ==========================================
        // 6. לוגיקת משחק 1: ציר הזמן
        // ==========================================
        function startTimelineGame() {
            currentGameMode = 'timeline';
            resetGame();
            document.getElementById('mode-title').innerText = "משחק 1: המלחמה על ציר הזמן";
            document.getElementById('timeline-panel').style.display = 'block';
            document.getElementById('event-log').style.display = 'block';
            
            // עדכון תוויות: הצג דגל + שם
            setTimeout(() => updateMapLabels(true), 500); 

            currentStageIndex = 0;
            score = 0;
            updateStatus();
            setTimeout(() => loadTimelineStage(0), 1000);
        }

        function loadTimelineStage(idx) {
            if (idx >= timelineStages.length) {
                alert("כל הכבוד! סיימת את המלחמה.");
                location.reload();
                return;
            }
            
            const stage = timelineStages[idx];
            document.getElementById('briefing-title').innerText = `${stage.year}: ${stage.title}`;
            document.getElementById('briefing-text').innerHTML = stage.text;
            
            map.flyTo(stage.zoom, 5, { duration: 2 });
            addToLog(stage.year, stage.title);
        }

        function checkTimelineAnswer(clickedName, layer) {
            const stage = timelineStages[currentStageIndex];
            
            if (clickedName === stage.targetId) {
                score += 100;
                updateStatus();
                
                let color = '#555';
                if (stage.action.includes('axis')) color = 'var(--axis-red)';
                else if (stage.action.includes('liberate') || stage.action.includes('final')) color = 'var(--allies-blue)';
                else if (stage.action === 'split') color = 'var(--axis-red)';

                layer.setStyle({ fillColor: color, fillOpacity: 0.8 });
                layer.feature.properties.permanentColor = color;

                alert(stage.successMsg);
                currentStageIndex++;
                loadTimelineStage(currentStageIndex);
            } else {
                score -= 10;
                updateStatus();
                alert("טעות במיקום. נסה שנית.");
            }
        }

        // ==========================================
        // 7. לוגיקת משחק 2: הכר את המפה (כרטיסים)
        // ==========================================
        function startCardsGame() {
            currentGameMode = 'cards';
            resetGame();
            document.getElementById('mode-title').innerText = "משחק 2: הכר את המפה";
            document.getElementById('cards-panel').style.display = 'none';
            document.getElementById('find-instruction').style.display = 'block';
            
            // עדכון תוויות: הצג דגל בלבד (ללא שם) לאתגר
            setTimeout(() => updateMapLabels(false), 500);

            shuffleArray(countryCards);
            currentStageIndex = 0;
            score = 0;
            updateStatus();
            
            map.setView([50, 15], 4);
            
            loadCardStage(0);
        }

        function loadCardStage(idx) {
            if (idx >= countryCards.length) {
                alert("סיימת את כל התיקים! כל הכבוד.");
                location.reload();
                return;
            }

            const card = countryCards[idx];
            
            document.getElementById('cards-panel').style.display = 'none';
            const instruction = document.getElementById('find-instruction');
            instruction.style.display = 'block';
            instruction.innerText = `איתור יעד: ${card.title}`;
            
            isInputLocked = false;
        }

        function checkCardAnswer(clickedName, layer) {
            const card = countryCards[currentStageIndex];
            
            if (clickedName === card.id) {
                score += 50;
                updateStatus();
                
                document.getElementById('find-instruction').style.display = 'none';
                const panel = document.getElementById('cards-panel');
                panel.style.display = 'block';
                document.getElementById('card-header').innerText = "תיק מדינה: " + card.title;
                document.getElementById('card-body').innerHTML = card.content;
                
                layer.setStyle({ fillColor: '#f1c40f', fillOpacity: 0.8 });
                layer.feature.properties.permanentColor = '#f1c40f';
                
                map.flyTo(layer.getBounds().getCenter(), 5);
                
                isInputLocked = true;
            } else {
                alert("טעות. זוהי " + (countryData[clickedName]?.name || clickedName));
            }
        }

        function nextCard() {
            currentStageIndex++;
            loadCardStage(currentStageIndex);
        }

        // ==========================================
        // 8. פונקציות עזר
        // ==========================================
        function updateStatus() {
            document.getElementById('status-display').innerText = "ניקוד: " + score;
        }

        function addToLog(year, text) {
            const logDiv = document.getElementById('event-log');
            const entry = document.createElement('div');
            entry.style.borderBottom = "1px dashed #555";
            entry.style.padding = "5px 0";
            entry.innerHTML = `<span style="color:var(--terminal-amber)">[${year}]</span> ${text}`;
            logDiv.prepend(entry);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

    </script>
